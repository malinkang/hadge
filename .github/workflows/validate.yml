name: Validate

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hadge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/set-xcode-version

      - name: Install build tools
        run: brew install sourcery swiftlint

      - name: Create local build configuration
        shell: bash
        env:
          OCTO_CLIENT_ID: ${{ secrets.OCTO_CLIENT_ID }}
          OCTO_CLIENT_SECRET: ${{ secrets.OCTO_CLIENT_SECRET }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && -n "$OCTO_CLIENT_ID" && -n "$OCTO_CLIENT_SECRET" ]]; then
            printf 'GITHUB_CLIENT_ID = "%s"\n' "$OCTO_CLIENT_ID" > Hadge/Secrets.xcconfig
            printf 'GITHUB_CLIENT_SECRET = "%s"\n' "$OCTO_CLIENT_SECRET" >> Hadge/Secrets.xcconfig
          else
            cp Hadge/Secrets.template.xcconfig Hadge/Secrets.xcconfig
          fi

      - name: Build without code signing
        shell: bash
        run: |
          xcodebuild \
            -project Hadge.xcodeproj \
            -scheme Hadge \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          xcodebuild \
            -project Hadge.xcodeproj \
            -scheme Hadge \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/HadgeDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/HadgePayload/Payload"
          cp -R "$RUNNER_TEMP/HadgeDeviceBuild/Build/Products/Release-iphoneos/Hadge.app" "$RUNNER_TEMP/HadgePayload/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/HadgePayload/Payload" "Hadge-1.1-57-unsigned.ipa"

      - name: Upload unsigned IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Hadge-1.1-57-unsigned
          path: Hadge-1.1-57-unsigned.ipa
          if-no-files-found: error
